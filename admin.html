<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Area riservata · Touch Revolution</title><style>body{font:16px system-ui;background:#f3f6fa;color:#173c57;margin:0}main{max-width:950px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px}h2{font-size:22px}section{background:white;border-radius:14px;padding:24px;margin:20px 0;box-shadow:0 5px 24px #183c5512}label{display:block;font-weight:600;margin:16px 0 6px}input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #c6d4e0;border-radius:7px}textarea{min-height:180px}input[type=checkbox]{width:auto}button,.button{border:0;border-radius:7px;background:#4882c5;color:white;padding:12px 17px;font:inherit;cursor:pointer;margin:6px 6px 0 0}.secondary{background:#e4edf7;color:#173c57}.danger{background:#a52a38}.entry{border-top:1px solid #e1e8ef;padding:18px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none}#message{color:#a52a38;white-space:pre-wrap}small{color:#617588}a{color:#3579bb}</style><main><header><div><small>TOUCH REVOLUTION</small><h1>Gestione case history</h1></div><a href="/case-history/">Vedi la pagina pubblica →</a></header><p id="message" role="status"></p><section id="login"><h2>Accedi</h2><p>Inserisci la password dell’area riservata.</p><form id="loginform"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Accedi</button></form></section><div id="app" class="hidden"><div class="row"><button id="new">+ Nuova case history</button><button class="secondary" id="logout">Esci</button></div><section id="edit" class="hidden"><h2 id="formtitle">Nuova case history</h2><form id="form"><input id="id" type="hidden"><label for="title">Titolo *</label><input id="title" maxlength="160" required><label for="client">Cliente</label><input id="client" maxlength="160"><label for="description">Descrizione *</label><textarea id="description" maxlength="10000" required></textarea><label for="image">Immagine di copertina</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><small>JPG, PNG o WebP, massimo 5 MB. Se non ne scegli una, l’immagine esistente rimane.</small><p><label><input id="published" type="checkbox"> Pubblica sul sito</label></p><button>Salva</button><button type="button" class="secondary" id="cancel">Annulla</button></form></section><section><h2>Le tue case history</h2><div id="list"></div></section></div></main><script>
const $=s=>document.querySelector(s),msg=t=>$('#message').textContent=t;let items=[];async function api(url,data){let r=await fetch(url,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Errore');return j}function editor(x={}){$('#id').value=x.id||'';$('#title').value=x.title||'';$('#client').value=x.client||'';$('#description').value=x.description||'';$('#published').checked=!!x.published;$('#image').value='';$('#formtitle').textContent=x.id?'Modifica case history':'Nuova case history';$('#edit').classList.remove('hidden');$('#edit').scrollIntoView({behavior:'smooth'})}async function load(){try{items=await api('/api/admin/cases');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');let list=$('#list');list.replaceChildren();if(!items.length)list.textContent='Non hai ancora aggiunto case history.';items.forEach(x=>{let row=document.createElement('div');row.className='entry';let h=document.createElement('strong');h.textContent=x.title;let p=document.createElement('p');p.textContent=(x.client?x.client+' · ':'')+(x.published?'Pubblicata':'Bozza');let edit=document.createElement('button');edit.className='secondary';edit.textContent='Modifica';edit.onclick=()=>editor(x);let del=document.createElement('button');del.className='danger';del.textContent='Elimina';del.onclick=async()=>{if(confirm('Eliminare questa case history?')){try{await api('/api/admin/delete',{id:x.id});await load()}catch(e){msg(e.message)}}};row.append(h,p,edit,del);list.append(row)})}catch(e){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}}$('#loginform').onsubmit=async e=>{e.preventDefault();msg('');try{await api('/api/login',{password:$('#password').value});$('#password').value='';await load()}catch(e){msg(e.message)}};$('#new').onclick=()=>editor();$('#cancel').onclick=()=>$('#edit').classList.add('hidden');$('#logout').onclick=async()=>{await api('/api/admin/logout',{});location.reload()};$('#form').onsubmit=async e=>{e.preventDefault();msg('');try{let f=$('#image').files[0],image='';if(f){if(f.size>5*1024*1024)throw Error('Immagine superiore a 5 MB');image=await new Promise((yes,no)=>{let r=new FileReader();r.onload=()=>yes(r.result);r.onerror=no;r.readAsDataURL(f)})}await api('/api/admin/save',{id:$('#id').value,title:$('#title').value,client:$('#client').value,description:$('#description').value,published:$('#published').checked,image});$('#edit').classList.add('hidden');await load();msg('Salvato con successo.')}catch(e){msg(e.message)}};load();
</script></html>

<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Case history · Touch Revolution</title><style>body{margin:0;font:16px system-ui;color:#153c55;background:#f5f7fa}header{background:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header img{width:260px;max-width:55vw}a{color:#347abf;text-decoration:none}main{max-width:1100px;margin:auto;padding:70px 24px}h1{font-size:clamp(40px,6vw,70px);margin:5px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:40px}article{background:white;border-radius:8px;overflow:hidden;box-shadow:0 6px 25px #173c5510}article img{width:100%;height:220px;object-fit:cover}article div{padding:24px}article p{white-space:pre-wrap;line-height:1.65;color:#50677a}small{letter-spacing:2px;color:#4882c5}footer{text-align:center;padding:40px}</style><header><a href="/"><img src="https://touchrevolution.it/wp-content/uploads/logo_draft-03_1.png" alt="Touch Revolution"></a><a href="/">← Home</a></header><main><small>TOUCH REVOLUTION</small><h1>Case history</h1><p>Le nostre storie di successo.</p><div class="grid" id="list"></div><p id="empty"></p></main><footer><a href="/admin">Area riservata</a></footer><script>fetch('/api/cases').then(r=>r.json()).then(items=>{let list=document.querySelector('#list');if(!items.length)document.querySelector('#empty').textContent='Le nuove case history saranno disponibili presto.';items.forEach(x=>{let a=document.createElement('article');if(x.image){let img=document.createElement('img');img.src=x.image;img.alt=x.title;a.append(img)}let d=document.createElement('div'),small=document.createElement('small'),h=document.createElement('h2'),p=document.createElement('p');small.textContent=x.client;h.textContent=x.title;p.textContent=x.description;d.append(small,h,p);a.append(d);list.append(a)})}).catch(()=>document.querySelector('#empty').textContent='Impossibile caricare le case history.');</script></html>
